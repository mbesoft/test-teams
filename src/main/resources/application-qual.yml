# Integration environment: all endpoints and credentials come from the runtime.
bp:
  teams:
    enabled: true
    token-url: ${BP_TEAMS_QUAL_TOKEN_URL}
    send-url: ${BP_TEAMS_QUAL_SEND_URL}
    client-id: ${BP_TEAMS_CLIENT_ID}
    client-secret: ${BP_TEAMS_CLIENT_SECRET}
    target-role: ${BP_TEAMS_TARGET_ROLE}
    apim-value: ${BP_TEAMS_APIM_VALUE}
