spring:
  application:
    name: bp-teams-notifier
  main:
    web-application-type: none
bp:
  teams:
    token-url: ${BP_TEAMS_TOKEN_URL}
    send-url: ${BP_TEAMS_SEND_URL}
    client-id: ${BP_TEAMS_CLIENT_ID}
    client-secret: ${BP_TEAMS_CLIENT_SECRET}
    target-role: ${BP_TEAMS_TARGET_ROLE}
    identity-header-name: ${BP_TEAMS_IDENTITY_HEADER_NAME}
    apim-value: ${BP_TEAMS_APIM_VALUE}
