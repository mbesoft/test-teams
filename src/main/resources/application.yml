spring:
  application:
    name: bp-teams-notifier
  profiles:
    # Running without an explicit profile is safe and uses local placeholders.
    default: local
  main:
    # This application exposes no inbound HTTP endpoint.
    web-application-type: none

bp:
  teams:
    # Sending is disabled unless an environment profile explicitly enables it.
    enabled: false
    identity-header-name: ${BP_TEAMS_IDENTITY_HEADER_NAME:X-App-Client}
    target-role-header-name: TargetAppRole
    apim-header-name: APIM
    connect-timeout: 5s
    read-timeout: 15s
